name: Check plugin center

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/check_plugin.py --all
      - run: python3 scripts/rebuild_catalog.py --check
      - run: python3 scripts/check_python_structure.py
      - run: npm ci --prefix website
      - run: node scripts/check_web_structure.mjs
      - run: npm run format:check --prefix website
      - run: npm run build --prefix website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: /belfry-desktop-plugins
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npm run test:browser
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: /belfry-desktop-plugins
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
